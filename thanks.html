<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дякуємо за замовлення — Sultry Shield</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="">
      <span class="brand__name">Sultry Shield</span>
    </a>
    <a class="cart-link" href="cart.html">
      Кошик <span class="cart-link__badge is-empty" data-cart-count>0</span>
    </a>
  </div>
</header>

<div class="thanks">
  <div class="thanks__icon">🖤</div>
  <h1>Дякуємо за замовлення!</h1>
  <p id="thanks-summary">Ми отримали ваше замовлення.</p>
  <p>Найближчим часом звʼяжемось з вами для підтвердження та деталей доставки.</p>
  <a class="btn btn--primary" href="index.html#catalog">Повернутись до каталогу</a>
</div>

<footer class="site-footer">
  <div class="container site-footer__bottom" style="border-top:none;margin-top:0;padding-top:0">
    <span>© 2026 Sultry Shield</span>
    <a href="index.html">На головну</a>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script>
  try {
    const order = JSON.parse(sessionStorage.getItem("sultryshield_last_order"));
    if (order) {
      document.getElementById("thanks-summary").textContent =
        order.name + ", ми отримали ваше замовлення на суму " + order.total + ".";
    }
  } catch (e) { /* показуємо загальний текст */ }
</script>
</body>
</html>
